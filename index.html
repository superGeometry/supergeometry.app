<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2125" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="supergeometry.app — a free 3D solid modeler that runs in your browser, on any device." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>supergeometry.app</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="pins"></div>

    <header id="topbar">
      <div class="brand">supergeometry<span class="brand-tld">.app</span></div>
      <input id="project-name" class="project-name" spellcheck="false" autocomplete="off" title="Project name — click to rename" aria-label="Project name" />
      <div class="menu-wrap">
        <button id="file-btn" class="text-btn">File</button>
        <div id="file-menu" class="menu" hidden>
          <button id="m-new">New project</button>
          <button id="m-open">Open…</button>
          <button id="m-save">Save project <kbd>Ctrl S</kbd></button>
          <hr />
          <button id="m-stl">Export STL</button>
          <button id="m-step">Export STEP</button>
          <button id="m-3mf">Export 3MF</button>
          <button id="m-dxf">Export DXF (sketch)</button>
        </div>
      </div>
      <button id="items-btn" class="text-btn" title="Items (bodies, sketches, planes)">Items</button>
      <div class="menu-wrap">
        <button id="more-btn" class="text-btn">More</button>
        <div id="more-menu" class="menu" hidden>
          <button id="m-fullscreen">Fullscreen<span class="menu-soon">F11</span></button>
          <button id="m-install" hidden>Install app <span class="menu-soon">Home screen</span></button>
          <button id="m-help">Help</button>
          <button id="m-tutorial">Tutorial <span class="menu-soon">soon</span></button>
          <button id="m-update">Reset cache &amp; update</button>
          <button id="m-about">About supergeometry.app <span class="menu-soon">↗</span></button>
          <button id="m-donate">Boost / Donate / Support <span class="menu-soon">↗</span></button>
          <hr />
          <div class="menu-note" id="m-version"></div>
        </div>
      </div>
    </header>

    <!-- Undo / redo: always at the bottom-left corner, in every mode. -->
    <nav id="undo-dock" aria-label="Undo and redo">
      <button id="undo-btn" class="dock-btn" title="Undo (Ctrl Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button id="redo-btn" class="dock-btn" title="Redo (Ctrl Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
    </nav>

    <div id="viewcube-host"></div>
    <nav id="right-col" aria-label="View settings"></nav>
    <div id="popover" hidden></div>

    <nav id="toolbar" aria-label="Tools"></nav>
    <nav id="bottom-left" aria-label="Section and measure"></nav>
    <div id="flyout" hidden></div>
    <div id="hint" hidden></div>
    <div id="status" hidden></div>
    <div id="panel" hidden></div>
    <div id="label" hidden></div>
    <div id="toast"></div>
    <div id="warn" hidden></div>

    <aside id="items">
      <div class="history-head">
        <span>Items</span>
        <span class="items-head-btns">
          <button id="items-pick" class="text-btn small" title="Tick items to put them in a folder (or Ctrl+click them)">Select</button>
          <button id="items-close" class="icon-btn" title="Close"></button>
        </span>
      </div>
      <ol id="items-list"></ol>
    </aside>

    <aside id="history">
      <div class="history-head">
        <span>History</span>
        <button id="history-close" class="icon-btn" title="Close"></button>
      </div>
      <ol id="history-list"></ol>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
